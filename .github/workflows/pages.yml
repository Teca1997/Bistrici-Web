# Copy to .github/workflows/pages.yml in Bistrici-Web ONLY after initial approval.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Automatski izradi poveznice na objavljene lekcije
        run: python3 .github/scripts/build_catalog.py
      - uses: actions/configure-pages@v5
      - name: Izoliraj sadrzaj stranice od povijesti i workflowa
        run: |
          mkdir /tmp/pages-site
          cp index.html .nojekyll /tmp/pages-site/
          cp -R assets /tmp/pages-site/
          if [ -d lessons ]; then cp -R lessons /tmp/pages-site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site
      - uses: actions/deploy-pages@v4
        id: deployment
